# 03 真实业务链路：情报流 → 卡片上的「交易」→ 交易面板 → 钱包
# 这条是典型的「跨页面、带状态」用例：验证从信号到下单入口的跳转没有断
appId: com.aigun.app
name: 03 情报到交易再到钱包
tags:
  - journey
  - p1
  - trade
---
- launchApp:
    clearState: false
- tapOn:
    text: '暂不开启'
    optional: true
- extendedWaitUntil:
    visible: '机会[\s\S]*'
    timeout: 30000

# 情报卡片右下角的「交易」按钮（index 0 = 第一张卡片）
# 注意别写成 tapOn: '交易' 去点底部 Tab —— 底部 Tab 的 content-desc 里也含「交易」，
# 这里用 index: 0 明确取第一个精确匹配项
- tapOn:
    text: '交易'
    index: 0

# 代币交易面板：这里有个坑 —— 面板有至少三种状态，取决于卡片里的币有没有交易对：
#   A. 已选代币：市价单/限价单 + 买入/卖出 + 立刻买入
#   B. 未选代币：请先选择代币 + 立即交易
# 而情报流的卡片是动态刷新的，每次跑 index: 0 命中的卡片可能不同。
# 所以断言只能选「三种状态都存在」的元素：底部那条「闪电模式」和主按钮。
- extendedWaitUntil:
    visible: '闪电模式[\s\S]*'
    timeout: 20000
- assertVisible: '(立刻买入|立即交易)'
- takeScreenshot: 03-trade-panel

# 返回情报流，再切到钱包核对余额区
- back
- tapOn: '钱包[\s\S]*'
- extendedWaitUntil:
    visible: '交易历史'
    timeout: 15000
- assertVisible: '接收'
- takeScreenshot: 03-wallet
