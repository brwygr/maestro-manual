# 03 真实业务链路：情报流 → 卡片上的「交易」→ 交易面板 → 钱包
# 这条是典型的「跨页面、带状态」用例：验证从信号到下单入口的跳转没有断
appId: com.aigun.app
name: 03 情报到交易再到钱包
tags:
  - journey
---
- launchApp:
    clearState: false
- tapOn:
    text: '暂不开启'
    optional: true
- extendedWaitUntil:
    visible: '机会[\s\S]*'
    timeout: 30000

# 情报卡片右下角的「交易」按钮（index 0 = 第一张卡片）
# 注意别写成 tapOn: '交易' 去点底部 Tab —— 底部 Tab 的 content-desc 里也含「交易」，
# 这里用 index: 0 明确取第一个精确匹配项
- tapOn:
    text: '交易'
    index: 0

# 代币交易面板：下单类型 + 买卖切换 + 快捷仓位
# 注意：面板默认是「市价单」，切到限价单才有 25%/50%/75%/100%。
# 所以这里断言「市价单或限价单」这种与当前模式无关的元素，别写死单一模式。
- extendedWaitUntil:
    visible: '(市价单|限价单)'
    timeout: 20000
- assertVisible: '买入'
- assertVisible: '卖出'
- assertVisible: '立刻买入'
- assertVisible: '自动止盈止损'
- takeScreenshot: 03-trade-panel

# 返回情报流，再切到钱包核对余额区
- back
- tapOn: '钱包[\s\S]*'
- extendedWaitUntil:
    visible: '交易历史'
    timeout: 15000
- assertVisible: '接收'
- takeScreenshot: 03-wallet
