# 04 钱包收款地址 —— 手写模板：从零把一个流程拆成 5 个动作
#
# 一条 flow = 三部分：
#   1) appId / name / tags   → 文件头，说明测谁、属于哪个模块和优先级
#   2) ---                   → 分隔符，必须有
#   3) - xxx                 → 步骤，一行一个命令

appId: com.aigun.app
name: 04 钱包收款地址
tags:
  - wallet      # 模块：钱包
  - p1          # 优先级：非冒烟
---
# ① 前置：打开钱包页。这一步被抽到了 subflows/_open_wallet.yaml，
#    因为 04、05 以及后面所有钱包用例都要用 —— 改一处，全生效。
- runFlow: ../subflows/_open_wallet.yaml

# ② 点「接收」→ 弹出网络选择 → 选 Solana
- tapOn: '接收'
- extendedWaitUntil:
    visible: '选择网络'
    timeout: 15000
- tapOn: 'Solana'

# ③ 断言收款页的关键元素：二维码 + 地址 + 复制按钮
- extendedWaitUntil:
    visible: 'Solana 网络收款'
    timeout: 15000
- assertVisible: 'qr code'
- assertVisible: '复制'
- takeScreenshot: 04-receive

# ④ 逐级返回：收款页 → 网络选择 → 钱包
#    这里踩过一次坑：只按一次 back 会停在「选择网络」而不是钱包，
#    所以要一层一层退，每退一层断言一次，才知道卡在哪。
- back
- assertVisible: '选择网络'
- back
- assertVisible: '交易历史'
